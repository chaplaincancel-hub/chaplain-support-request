<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Chaplain Request Log</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#eef3f8;color:#15283f}header{background:#071e3d;color:#fff;padding:20px;border-bottom:4px solid #d4a62c}main{max-width:1000px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 5px 20px #1232}.row{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:99px;background:#e7eef7;font-size:12px}button,select,input{padding:10px;border-radius:8px;border:1px solid #b9c7d8}button{cursor:pointer;font-weight:700}.danger{background:#a92e29;color:#fff}.settings{display:grid;grid-template-columns:1fr auto;gap:8px}.small{font-size:12px;color:#617087}</style></head><body><header><h2 style='margin:0'>CHAPLAIN SUPPORT REQUEST LOG</h2><div>Chaplain Nelson Cancel</div></header><main><div class='card'><b>Free notification setup</b><p class='small'>Enter the email address that should receive prepared support requests on this device. This is stored only in this browser.</p><div class='settings'><input id='recipient' type='email' placeholder='Your notification email'><button id='saveEmail'>SAVE</button></div></div><div class='row'><button onclick='render()'>REFRESH</button><button class='danger' id='clear'>DELETE ALL LOCAL REQUESTS</button></div><div id='list'></div></main><script>const $=x=>document.getElementById(x);$('recipient').value=localStorage.getItem('chaplainRecipientEmail')||'';$('saveEmail').onclick=()=>{localStorage.setItem('chaplainRecipientEmail',$('recipient').value.trim());alert('Notification email saved on this device.');};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let a=JSON.parse(localStorage.getItem('chaplainRequests')||'[]');$('list').innerHTML=a.length?'':'<div class="card">No requests stored on this device.</div>';a.forEach((r,i)=>{$('list').insertAdjacentHTML('beforeend',`<div class='card'><div class='row'><span class='pill'>${esc(r.status)}</span><span class='pill'>${esc(r.urgency)}</span><span class='pill'>${esc(r.department)}</span></div><h3>${esc(r.category)}</h3><p><b>${esc(r.name)}</b> · ${new Date(r.created).toLocaleString()}</p><p>${esc(r.message||'No message')}</p><p class='small'>Preferred: ${esc(r.contactMethod)} · Phone: ${esc(r.phone||'—')} · Email: ${esc(r.email||'—')}</p><div class='row'><select onchange='status(${i},this.value)'><option${r.status==='New'?' selected':''}>New</option><option${r.status==='Acknowledged'?' selected':''}>Acknowledged</option><option${r.status==='Contacted'?' selected':''}>Contacted</option><option${r.status==='Completed'?' selected':''}>Completed</option></select><button class='danger' onclick='del(${i})'>DELETE</button></div></div>`)});}function status(i,v){let a=JSON.parse(localStorage.getItem('chaplainRequests')||'[]');a[i].status=v;localStorage.setItem('chaplainRequests',JSON.stringify(a));render()}function del(i){if(!confirm('Delete this request?'))return;let a=JSON.parse(localStorage.getItem('chaplainRequests')||'[]');a.splice(i,1);localStorage.setItem('chaplainRequests',JSON.stringify(a));render()}$('clear').onclick=()=>{if(prompt('Type DELETE ALL to remove all requests stored on this device.')==='DELETE ALL'){localStorage.removeItem('chaplainRequests');render()}};render();</script></body></html>
